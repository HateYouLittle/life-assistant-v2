name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.16.0 是 package.json engines 的下界（isOpen/isTransaction），
        # 只测最新的 22.x 会漏掉下界回归。
        node: [22.16.0, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # 生产依赖的已知漏洞零容忍：有 high/critical 直接失败（devDependencies 不参与）
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # 并发/超时类用例（daemon 锁接管、看门狗）在 2 核 runner 上偶发调度抖动，
      # 本地 5/5 稳定、CI 两次分别挂在不同用例。限制文件并发 + 整轮重跑一次，
      # 只吃掉调度抖动，确定性失败仍然会红。
      - name: Run tests
        run: npm test -- --test-concurrency=2 || npm test -- --test-concurrency=2
      - run: npm run build
